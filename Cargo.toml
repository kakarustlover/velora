[package]
name = "velora"
version = "1.0.0"
edition = "2021"
description = "Velora - glass music player (Rust + Slint)"
build = "build.rs"

[lib]
name = "velora"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "velora-desktop"
path = "src/main.rs"

[dependencies]
slint = { version = "1.8", default-features = false, features = ["compat-1-2", "std", "image-default-formats", "renderer-femtovg"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
lofty = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
rayon = "1"
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.8", default-features = false, features = ["compat-1-2", "std", "image-default-formats", "renderer-femtovg", "backend-android-activity-06"] }
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.21"
ndk-context = "0.1"
android_logger = "0.14"

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.8", default-features = false, features = ["compat-1-2", "std", "image-default-formats", "renderer-femtovg", "backend-winit"] }
dirs = "5"
env_logger = "0.11"

[build-dependencies]
slint-build = "1.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
